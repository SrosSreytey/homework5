<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 3</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .layout3{
            width:95%;
            background:green;
            margin:auto;
            padding:20px;
        }

        .pageHeader{
            width:100%;
            height:60px;
            background:#b7d89b;
            margin-bottom:20px;
            padding:15px;
            font-size:25px;
        }

        .Nav{
            width:100%;
            height:60px;
            background:#b7d89b;
            margin-bottom:20px;
            padding:15px;
            font-size:25px;
        }
        .Article{
            display:flex;
            gap:20px;
            margin-bottom:20px;
        }

        .left{
            flex:2;
            background:#b7d89b;
            padding:10px;
        }

        .left h2{
            text-align:center;
            margin-bottom:20px;
            font-weight:normal;
        }

        .Articleheader{
            background:white;
            padding:15px;
            margin-bottom:20px;
            font-size:22px;
        }

        .Main{
            height:220px;
            background:white;
            display:flex;
            align-items:center;
            padding-left:15px;
            font-size:25px;
        }

        .right{
            flex:1;
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .top{
            display:flex;
            gap:20px;
        }

        .Aside{
            flex:1;
            background:#b7d89b;
            height:110px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:25px;
        }
        .bottomAsid{
            background:#b7d89b;
            height: 300px;
            display:flex;
            align-items:center;
            padding-left:15px;
            font-size:25px;
        }
        .section{
            background:#b7d89b;
            height:100px;
            display:flex;
            align-items:center;
            padding-left:15px;
            font-size:25px;
            margin-bottom:10px;
        }

        .Footer{
            width:100%;
            height:60px;
            background:#b7d89b;
            padding:15px;
            font-size:25px;
        }
    </style>
</head>
<body>
<div class="layout3">
    <div class="pageHeader"> Page Header</div>
    <div class="Nav"> Nav</div>
    <div class="Article">
        <div class="left">
            <h2>Article</h2>
            <div class="Articleheader"> Article Header </div>
            <div class="Main"> Main </div>
        </div>
        <div class="right">
            <div class="top">
                <div class="Aside">Aside </div>
                <div class="Aside">Aside</div>
            </div>
            <div class="bottomAsid">Aside
            </div>
        </div>
    </div>
    <div class="section"> Section</div>
    <div class="Footer"> Footer</div>
</div>
</body>
</html>
