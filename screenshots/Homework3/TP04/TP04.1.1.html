<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
</head>

<style>
    body {
        margin: auto;
        width: 600px;
        height: 600px;
        display: flex;
        flex-wrap: wrap;
        border: 4px black solid;
        justify-content: space-evenly;
        align-items: center;
    }

    .parent{
    width:200px;
    height:200px;
    background:#D9D9D9;
    padding:5px;
    display:flex;
}

.parent-1{
    justify-content:flex-start;
    align-items:flex-start;
}

.parent-2{
    justify-content:flex-start;
    align-items:flex-start;
}

.parent-3{
    justify-content:flex-start;
    align-items:flex-end;
}

.parent-4{
    justify-content:flex-end;
    align-items:flex-start;
}

    .child-h{
    width:100%;
    height:50px;
    background:#FF8A00;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.child-v{
    width:50px;
    height:100%;
    background:#FF8A00;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}
    

</style>

<body>
    <div class="parent parent-1">
        <div class="child-h">child</div>
    </div>
    <div class="parent parent-2">
        <div class="child-v">child</div>
    </div>
    <div class="parent parent-3">
        <div class="child-h">child</div>
    </div>
    <div class="parent parent-4">
        <div class="child-v">child</div>
    </div>
</body>

</html>
