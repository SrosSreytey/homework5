<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: auto;
        width: 600px;
        height: 600px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
        align-items: center;
        border: 4px black solid;

    }
    .parent{
        width: 200px;
        height: 200px;
        background-color: #D9D9D9;
        padding: 5px;
        position: relative;
    }
    .child{
        width: 50px;
        height: 50px;
        background-color: #ff8a00;
        color: white;
        justify-content: center;
        align-items: center;
        display: flex;
        position: relative;
        position:absolute;
    }
    .child1{
        left: 5px;
        top: 50%;
    }
    .child2{
        bottom: 5px;
        left: 5px;
    }
    .child3{
        left: 50%;
        top: 50%;
        translate: -50% -50%;
    }
</style>
<body>
    <div class="parent parent-1">
        <div class="child child1">child</div>
        </div>
    <div class="parent parent-2">
        <div class="child child2">child</div>
    </div>
    <div class="parent parent-3 ">
        <div class="child child3">child</div>
    </div>
    <div class="parent parent-4">
        <div class="child child4">child</div>
    </div>
    
</body>
</html>
