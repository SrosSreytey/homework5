<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .layout1{
        width: 500px;
        background-color: green;
        margin: auto;
        padding: 10px;
    }
    .pageHeader{
        width:100% ;
        margin: auto;
        background-color: rgb(157, 231, 157);
        color: black;
        padding: 10px;
        margin-bottom: 10px;
         
    }
    .Nav,
    .header,
    .section,
    .Aside,
    .Footer{
        width:100% ;
        background-color: rgb(157, 231, 157);
        color: black; 
        margin-bottom: 10px;
        padding: 10px;
        
    }
    .Article{
        width: 100%;
        background-color: rgb(115, 223, 113);
        color: black;
        padding: 10px;
        margin-bottom: 20px;
        
        
    }
    .Articleheader{
        width: 100%;
        background-color: white;
        padding: 10px;
        margin-bottom: 20px;
        justify-content: space-between;
        
        
    }
    .Main{
        width: 100%;
        background-color: white;
        height: 200px;
        padding-left: 10px;
        
    }
</style>
<body>
    <div class="layout1">
        <div class="pageHeader">Page Header</div>
        <div class="Nav">Nav</div>
        <div class="Article">Article
            <div class="Articleheader">Article Header</div>
            <div class="Main">Main</div>
        </div>
        <div class="section">Section</div>
        <div class="Aside">Aside</div>
        <div class="Footer">Footer</div>
    </div>
</body>
</html>
