<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .content{
        display: grid;
        grid-template-columns:200px 200px;
        grid-template-rows: 50px 200px 300px 50px;
        grid-template-areas: 
        'side1 side1'
        'side2 side3'
        'side4 side4'
        'side5 side5';
        gap: 10px;
    }
    @media only screen and (max-width:500px){

    }
    .side1{
        background-color: gray;
        grid-area: side1;
    }
    .side2{
        background-color: rgb(151, 194, 204);
        grid-area: side2;
    }
    .side3{
        background-color: aquamarine;
        grid-area: side3;
    }
    .side4{
        background-color: aqua;
        grid-area: side4;
    }
    .side5{
        background-color: rgb(182, 143, 96);
        grid-area: side5;
    }
    .box{
        background-color: rgb(242, 11, 11);
        height: 50px;
        width:50px ;
        margin: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;


    }
</style>
<body>
    <div class="content">
        <div class="side1"></div>
        <div class="side2"></div>
        <div class="side3"> </div>
        <div class="side4">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <div class="side5"></div>
    </div>
</body>
</html>
